<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin Antrian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen p-4">
  <div id="loginBox" class="max-w-sm mx-auto mt-16 bg-zinc-900 border border-zinc-800 rounded-2xl p-6">
    <h1 class="text-xl font-bold text-amber-400 mb-4">Login Admin (<span id="userLabel"></span>)</h1>
    <input id="passInput" type="password" placeholder="Masukkan password admin" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm mb-3 outline-none" />
    <button onclick="login()" class="w-full bg-amber-500 text-zinc-950 font-bold py-2 rounded-lg">Masuk</button>
  </div>

  <div id="panel" class="hidden max-w-xl mx-auto space-y-6 pb-12">
    <!-- Tambah Antrian Manual -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
      <h2 class="font-bold text-amber-400 mb-3">Tambah Antrian Manual</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
        <input id="pName" placeholder="Nama / Nick FF" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none" />
        <select id="pCategory" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none"></select>
        <input id="pNote" placeholder="Catatan (opsional)" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none" />
      </div>
      <button onclick="addQueue()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-2 rounded-lg text-sm transition">+ Tambah ke Antrian</button>
    </div>

    <!-- Daftar Antrian Aktif -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-amber-400">Daftar Antrian Aktif</h2>
        <button onclick="clearQueue()" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 px-3 py-1 rounded-lg">Reset Semua</button>
      </div>
      <ul id="adminList" class="space-y-2 text-sm"></ul>
    </div>

    <!-- Pengaturan Kategori & Minimal Donasi -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
      <div>
        <h2 class="font-bold text-amber-400">Kategori & Minimal Donasi</h2>
        <p class="text-xs text-zinc-400">Donasi otomatis masuk ke kategori sesuai nominalnya.</p>
      </div>

      <div id="categoryList" class="space-y-2"></div>

      <div class="flex gap-2 pt-1">
        <input id="newCatName" placeholder="Nama Kategori (misal: VIP)" class="flex-1 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none" />
        <input id="newCatMin" type="number" placeholder="Min Rp (misal: 25000)" class="w-40 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none" />
        <button onclick="addCategory()" class="bg-sky-500 hover:bg-sky-400 text-zinc-950 font-bold px-3 rounded-lg text-sm shrink-0">+ Kategori</button>
      </div>

      <hr class="border-zinc-800" />

      <div class="space-y-2">
        <label class="block text-xs text-zinc-400">Judul Overlay</label>
        <input id="setTitle" placeholder="Judul Overlay" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none" />
        <label class="block text-xs text-zinc-400 pt-1">Webhook Token SociaBuzz</label>
        <input id="setToken" placeholder="Webhook Token SociaBuzz" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none" />
      </div>

      <button onclick="saveSettings()" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-2.5 rounded-lg text-sm transition">Simpan Semua Pengaturan</button>
    </div>
  </div>

  <script>
    const username = window.location.pathname.split('/').pop();
    document.getElementById('userLabel').textContent = username;
    let savedPass = '';
    let categories = [];
    const socket = io();

    async function login() {
      savedPass = document.getElementById('passInput').value;
      const res = await fetch(`/api/admin/${username}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPass })
      });
      const data = await res.json();
      if (!res.ok) return alert(data.error);

      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panel').classList.remove('hidden');
      document.getElementById('setTitle').value = data.settings.title || '';
      document.getElementById('setToken').value = data.webhookToken || '';
      categories = data.settings.categories || [];
      renderCategories();
      renderList(data.queue);
      socket.emit('join_room', username);
    }

    socket.on('update_queue', ({ queue, settings }) => {
      renderList(queue);
      if (settings && settings.categories) {
        categories = settings.categories;
        renderCategories();
      }
    });

    function renderCategories() {
      const catEl = document.getElementById('categoryList');
      const selectEl = document.getElementById('pCategory');

      if (!categories.length) {
        catEl.innerHTML = '<p class="text-xs text-zinc-500 italic">Belum ada kategori. Tambahkan minimal 1 kategori.</p>';
        selectEl.innerHTML = '<option value="Reguler">Reguler</option>';
        return;
      }

      catEl.innerHTML = categories.map((cat, idx) => `
        <div class="flex items-center justify-between bg-zinc-950 border border-zinc-800 px-3 py-2 rounded-lg text-sm">
          <div>
            <span class="font-bold text-amber-400">${cat.name}</span>
            <span class="text-xs text-zinc-400 ml-2">Min: Rp${Number(cat.minAmount).toLocaleString('id-ID')}</span>
          </div>
          <button onclick="removeCategory(${idx})" class="text-xs bg-red-500/20 text-red-400 px-2 py-1 rounded">Hapus</button>
        </div>
      `).join('');

      selectEl.innerHTML = categories.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('');
    }

    function addCategory() {
      const name = document.getElementById('newCatName').value.trim();
      const minAmount = Number(document.getElementById('newCatMin').value);
      if (!name || isNaN(minAmount) || minAmount < 0) {
        return alert('Isi nama kategori dan nominal minimal donasi dengan benar!');
      }
      categories.push({ name, minAmount });
      categories.sort((a, b) => b.minAmount - a.minAmount);
      document.getElementById('newCatName').value = '';
      document.getElementById('newCatMin').value = '';
      renderCategories();
    }

    function removeCategory(idx) {
      if (categories.length <= 1) return alert('Minimal harus ada 1 kategori!');
      categories.splice(idx, 1);
      renderCategories();
    }

    function renderList(queue) {
      const el = document.getElementById('adminList');
      if (!queue.length) {
        el.innerHTML = '<li class="text-zinc-500 text-xs italic">Antrian kosong</li>';
        return;
      }
      el.innerHTML = queue.map((q, idx) => `
        <li class="flex justify-between items-center bg-zinc-950 border border-zinc-800 px-3 py-2 rounded-lg">
          <div class="truncate pr-2">
            <span class="text-amber-400 font-bold">#${idx + 1}</span>
            <span class="bg-amber-500/20 text-amber-300 text-[10px] font-bold px-1.5 py-0.5 rounded mx-1 uppercase">${q.category || 'Reguler'}</span>
            <span class="font-semibold">${q.name}</span>
            ${q.note ? `<span class="text-xs text-zinc-400">(${q.note})</span>` : ''}
          </div>
          <button onclick="removeQueue(${idx})" class="bg-red-500 hover:bg-red-400 text-white text-xs px-2.5 py-1 rounded shrink-0">Selesai</button>
        </li>
      `).join('');
    }

    async function sendAction(payload) {
      await fetch(`/api/admin/${username}/queue`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedPass, ...payload })
      });
    }

    function addQueue() {
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value;
      const note = document.getElementById('pNote').value.trim();
      if (!name) return;
      sendAction({ action: 'add', name, category, note });
      document.getElementById('pName').value = '';
      document.getElementById('pNote').value = '';
    }

    function removeQueue(index) { sendAction({ action: 'remove', index }); }
    function clearQueue() { if (confirm('Reset semua antrian?')) sendAction({ action: 'clear' }); }

    function saveSettings() {
      if (!categories.length) return alert('Tambahkan minimal 1 kategori sebelum menyimpan!');
      sendAction({
        action: 'settings',
        webhookToken: document.getElementById('setToken').value.trim(),
        settings: {
          title: document.getElementById('setTitle').value.trim(),
          categories
        }
      });
      alert('Pengaturan & Kategori tersimpan!');
    }
  </script>
</body>
</html>
