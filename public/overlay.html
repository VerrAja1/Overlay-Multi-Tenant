<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Overlay Antrian</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: transparent; overflow: hidden; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="p-4">
  <div class="w-80 bg-zinc-950/90 border-2 border-amber-500 rounded-2xl p-4 shadow-2xl text-white">
    <div class="flex items-center justify-between border-b border-zinc-800 pb-2 mb-3">
      <h2 id="title" class="font-black text-amber-400 tracking-wide text-lg uppercase">ANTRIAN BY ONE</h2>
      <span id="count" class="bg-amber-500 text-zinc-950 text-xs font-extrabold px-2 py-0.5 rounded-full">0</span>
    </div>
    <ul id="list" class="space-y-2 text-sm">
      <li class="text-zinc-500 italic text-xs">Belum ada antrian...</li>
    </ul>
  </div>

  <script>
    const username = window.location.pathname.split('/').pop();
    const socket = io();
    socket.emit('join_room', username);

    socket.on('update_queue', ({ queue, settings }) => {
      if (settings && settings.title) document.getElementById('title').textContent = settings.title;
      document.getElementById('count').textContent = queue.length;
      const list = document.getElementById('list');
      if (!queue.length) {
        list.innerHTML = '<li class="text-zinc-500 italic text-xs">Belum ada antrian...</li>';
        return;
      }
      list.innerHTML = queue.map((item, i) => `
        <li class="flex items-center justify-between bg-zinc-900/90 border border-zinc-800 px-3 py-2 rounded-xl">
          <div class="truncate pr-2">
            <span class="text-amber-400 font-bold mr-1">#${i + 1}</span>
            <span class="font-semibold">${item.name}</span>
          </div>
          <span class="text-[11px] text-zinc-400 shrink-0">${item.note || ''}</span>
        </li>
      `).join('');
    });
  </script>
</body>
</html>
